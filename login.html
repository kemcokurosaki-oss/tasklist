<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サインイン - __APP_TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
    body { font-family: 'メイリオ', Meiryo, sans-serif; background: #f3f3f1; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; border-radius: 10px; padding: 32px 28px; width: 320px; box-shadow: 0 12px 40px rgba(0,0,0,.15); text-align: center; }
    h1 { font-size: 15px; margin: 0 0 20px; color: #333; }
    .ms-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #fff; color: #1f1f1f; border: 1px solid #c8cfda; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit; }
    .ms-btn:hover { background: #f3f6fa; }
    .err { color: #e74c3c; font-size: 12px; margin-top: 12px; min-height: 0; }
</style>
</head>
<body>
<div class="box">
    <h1>__APP_TITLE__ ログイン</h1>
    <button type="button" class="ms-btn" id="ms_btn">
        <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        Microsoftでサインイン
    </button>
    <div class="err" id="err"></div>
</div>
<script>
    const client = supabase.createClient("__SUPABASE_URL__", "__SUPABASE_ANON_KEY__");

    function setCookieFromSession(session) {
        if (!session) return;
        const maxAge = Math.max(0, session.expires_at - Math.floor(Date.now() / 1000));
        document.cookie = `sb_at=${session.access_token}; path=/; max-age=${maxAge}; secure; samesite=lax`;
    }

    client.auth.onAuthStateChange((event, session) => {
        if (session) { setCookieFromSession(session); location.replace('/'); }
    });
    client.auth.getSession().then(({ data: { session } }) => {
        if (session) { setCookieFromSession(session); location.replace('/'); }
    });

    const p = new URLSearchParams(window.location.hash.replace('#', '?'));
    const err = p.get('error');
    if (err) document.getElementById('err').textContent = 'サインインに失敗しました（' + (p.get('error_description') || err) + '）';

    document.getElementById('ms_btn').addEventListener('click', async () => {
        // Supabase の Site URL は他のアプリ（設計工程表など）に設定されているため、
        // ログイン後にそちらへ戻されることがある。戻り先を覚えておき、違うページに着地したら
        // 向こうの m365-login.js がトークンごとこのページへ送り返してくれる
        localStorage.setItem('m365_return_to', window.location.origin + '/login');
        const { error } = await client.auth.signInWithOAuth({
            provider: 'azure',
            options: { scopes: 'openid profile email', redirectTo: window.location.origin + '/login' }
        });
        if (error) document.getElementById('err').textContent = 'サインインを開始できませんでした';
    });
</script>
</body>
</html>
