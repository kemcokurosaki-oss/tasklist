<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タスクリスト</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='75' font-size='80' text-anchor='middle'>📋</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css?v=20261125c">
</head>
<body class="not-logged-in">
    <div class="header-panel">
        <div class="header-row">
            <span id="app_title" class="app-title">📋 タスクリスト</span>
        </div>
    </div>

    <!-- ===== ダッシュボード（工番の一覧） ===== -->
    <div id="dashboard_view" class="main-container">
        <div class="toolbar">
            <div class="seg" id="dash_seg">
                <button type="button" class="seg-btn active" data-mode="open">進行中の工事 <span class="seg-count" id="dash_count_open"></span></button>
                <button type="button" class="seg-btn" data-mode="closed">過去の工事 <span class="seg-count" id="dash_count_closed"></span></button>
            </div>
            <input type="text" id="dash_search" class="header-input" placeholder="工番・客先で検索" style="width:200px">
            <div class="action-controls">
                <button type="button" class="btn btn-primary" id="new_project_btn">＋ 工事を追加</button>
            </div>
        </div>
        <div id="project_grid" class="project-grid"></div>
        <div id="dash_empty" class="empty-state" style="display:none"></div>
    </div>

    <!-- ===== 工番ごとのタスク一覧 ===== -->
    <div id="project_view" class="main-container" style="display:none">
        <div class="project-head">
            <button type="button" class="btn btn-back" id="back_btn">← 工事一覧</button>
            <h1 class="project-title"><span id="pv_number"></span><span id="pv_title" class="project-sub"></span><span id="pv_closed_tag" class="closed-tag" style="display:none">過去の工事</span></h1>
            <div class="action-controls">
                <button type="button" class="btn" id="edit_project_btn">工事の設定</button>
                <button type="button" class="btn btn-primary" id="new_issue_btn">＋ タスクを登録</button>
            </div>
        </div>

        <div class="tabs" id="pv_tabs"></div>

        <div class="toolbar">
            <select id="pv_machine" class="header-select"></select>
            <input type="text" id="pv_keyword" class="header-input" placeholder="ユニット・項目・担当者で検索" style="width:240px">
            <span id="issue_count" class="issue-count"></span>
            <span id="grid_status" class="grid-status"></span>
        </div>

        <div class="grid-wrap" id="grid_wrap">
            <table class="grid" id="grid">
                <colgroup id="grid_cols"></colgroup>
                <thead id="grid_head"></thead>
                <tbody id="grid_body"></tbody>
            </table>
            <textarea id="grid_editor" class="grid-editor" spellcheck="false" autocomplete="off" aria-label="セルの入力"></textarea>
            <div id="grid_suggest" class="grid-suggest"></div>
        </div>
        <div class="grid-help">セルを選んでそのまま入力（ダブルクリック・F2 で今の値を編集）／ Tab・Enter・矢印で移動 ／ Alt+Enter でセル内改行 ／ Ctrl+C・Ctrl+V で Excel とコピー貼り付け ／ Delete で消去 ／ Ctrl+Z で元に戻す ／ 一番下の「＋」行に入力すると新しいタスク ／ No. をダブルクリックで詳細・状況の履歴</div>
    </div>

    <!-- ===== タスクの詳細・編集ダイアログ ===== -->
    <div id="detail_overlay" class="overlay">
        <div class="dialog">
            <div class="dialog-header">
                <span id="dialog_title">タスクの登録</span>
                <button type="button" class="dialog-close" id="dialog_close_btn">×</button>
            </div>
            <div class="dialog-body">
                <div class="form-grid">
                    <label>工番 <span class="req">*</span>
                        <input type="text" id="f_project_number">
                    </label>
                    <label>分類
                        <select id="f_category"></select>
                    </label>
                    <label>ステータス
                        <select id="f_status"></select>
                    </label>
                    <label>機械
                        <input type="text" id="f_machine" list="machine_options">
                        <datalist id="machine_options"></datalist>
                    </label>
                    <label>ユニット
                        <input type="text" id="f_unit" list="unit_options">
                        <datalist id="unit_options"></datalist>
                    </label>
                    <label>発見日
                        <input type="date" id="f_found_date">
                    </label>
                    <label>発見者
                        <input type="text" id="f_finder" list="assignee_options">
                    </label>
                    <label>担当者
                        <input type="text" id="f_owner" list="assignee_options">
                    </label>
                    <label>設計担当
                        <input type="text" id="f_design_owner" list="assignee_options">
                    </label>
                    <label>施工担当
                        <input type="text" id="f_construction_owner" list="assignee_options">
                    </label>
                    <datalist id="assignee_options"></datalist>
                    <label>現工程完了日
                        <input type="date" id="f_current_process_due">
                    </label>
                    <label>完了予定日
                        <input type="date" id="f_due_date">
                    </label>
                    <label>完了日
                        <input type="date" id="f_completed_date">
                    </label>
                </div>
                <label class="full-row">項目（タスク内容）
                    <textarea id="f_item" rows="2"></textarea>
                </label>
                <label class="full-row">詳細・対応策
                    <textarea id="f_detail" rows="3"></textarea>
                </label>

                <div id="notes_section" style="display:none">
                    <h3>状況（履歴）</h3>
                    <div id="notes_list" class="notes-list"></div>
                    <div class="note-add-row">
                        <textarea id="f_new_note" rows="2" placeholder="状況を追記（日付は自動で入ります）"></textarea>
                        <button type="button" class="btn" id="add_note_btn">追記</button>
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn btn-danger" id="archive_btn" style="display:none">削除（一覧から外す）</button>
                <div class="dialog-footer-right">
                    <button type="button" class="btn" id="cancel_btn">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="save_btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 工事の追加・設定ダイアログ ===== -->
    <div id="project_overlay" class="overlay">
        <div class="dialog dialog-sm">
            <div class="dialog-header">
                <span id="project_dialog_title">工事を追加</span>
                <button type="button" class="dialog-close" id="project_close_btn">×</button>
            </div>
            <div class="dialog-body">
                <label class="full-row">工番 <span class="req">*</span>
                    <input type="text" id="p_number" placeholder="例：2810">
                </label>
                <label class="full-row">客先・件名
                    <input type="text" id="p_title" placeholder="空欄なら工程表の客先名を表示">
                </label>
                <div id="p_close_row" class="close-row" style="display:none">
                    <div>
                        <div class="close-row-title" id="p_close_label"></div>
                        <div class="close-row-help" id="p_close_help"></div>
                    </div>
                    <button type="button" class="btn" id="p_close_btn"></button>
                </div>
            </div>
            <div class="dialog-footer">
                <div class="dialog-footer-right">
                    <button type="button" class="btn" id="project_cancel_btn">キャンセル</button>
                    <button type="button" class="btn btn-primary" id="project_save_btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="m365-login.js?v=20261124a"></script>
    <script src="auth.js?v=20261124a"></script>
    <script src="app.js?v=20261125c"></script>
    <script src="grid.js?v=20261125c"></script>
</body>
</html>
